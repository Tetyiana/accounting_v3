# Пінгує Supabase кожні 3 дні, щоб безкоштовний проєкт
# не ставився на паузу (пауза настає після 7 днів неактивності).
# URL і publishable-ключ і так публічні (зашиті у src/lib/supabase.js) —
# тримати їх у секретах не потрібно.
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # кожні 3 дні о 06:00 UTC
  workflow_dispatch:          # можна запустити вручну для перевірки

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://ggsaaymebyotodpjjukb.supabase.co
          SUPABASE_KEY: sb_publishable_h-f0UaUZVyXjeD9Rj2T7-w_B97wydX1
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/fops?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          cat /tmp/body
          # 200 (ok) або 401/406 (RLS відхилив анонімний запит) — все одно
          # рахується активністю і будить/тримає проєкт активним.
          # Провал тільки при 5xx або мережевій помилці.
          if [ "$code" -ge 500 ] || [ "$code" -lt 200 ]; then
            echo "Supabase не відповідає"; exit 1
          fi
