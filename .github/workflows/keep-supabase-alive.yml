# Пінгує Supabase кожні 3 дні, щоб безкоштовний проєкт
# не ставився на паузу (пауза настає після 7 днів неактивності).
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # кожні 3 дні о 06:00 UTC
  workflow_dispatch:          # можна запустити вручну для перевірки

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/fops?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 200 (ok) або 401/406 (RLS відхилив анонімний запит) — все одно
          # рахується активністю і будить/тримає проєкт активним
          if [ "$code" -ge 500 ]; then
            echo "Supabase не відповідає"; exit 1
          fi
