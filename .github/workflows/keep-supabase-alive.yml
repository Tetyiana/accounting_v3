# Пінгує Supabase кожні 2 дні, щоб безкоштовний проєкт
# не ставився на паузу (пауза настає після 7 днів неактивності).
# УВАГА: пінг здатен не дати заснути, але НЕ здатен розбудити.
# Якщо крок впав — проєкт уже спить, треба будити руками в дашборді.
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 */2 * *'   # кожні 2 дні о 06:00 UTC
  workflow_dispatch:          # можна запустити вручну для перевірки

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://ggsaaymebyotodpjjukb.supabase.co
          SUPABASE_KEY: sb_publishable_h-f0UaUZVyXjeD9Rj2T7-w_B97wydX1
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/fops?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY") || {
              echo "::error::Хост не відповідає — проєкт Supabase, найімовірніше, на паузі. Розбудити вручну в дашборді."
              exit 1
            }
          echo "HTTP $code"
          cat /tmp/body
          # 200 (ok) або 401/406 (RLS відхилив анонімний запит) — все одно
          # рахується активністю і тримає проєкт живим.
          if [ "$code" -ge 500 ] || [ "$code" -lt 200 ]; then
            echo "::error::Supabase відповів $code"
            exit 1
          fi